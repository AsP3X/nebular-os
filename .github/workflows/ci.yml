name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master, "cursor/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    # Human: RustSec advisory scan of Cargo.lock; ignores with their reasons live in .cargo/audit.toml.
    # Non-blocking, so a new advisory is reported without stopping unrelated work.
    continue-on-error: true
    # Human: audit-check reports through a check run, which the default token may not create.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nebular-os:ci .
