name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master, "cursor/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    # Human: RustSec advisory scan of Cargo.lock. Non-blocking until the dependency tree has been triaged
    # once in CI; read the job log for findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nebular-os:ci .
