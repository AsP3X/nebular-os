[package]
name = "nebular-os"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Niklas Vorberg"]
license-file = "LICENSE"
description = "Standalone self-hosted object storage with an S3-like HTTP API"
repository = "https://github.com/AsP3X/nebular-os"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
tower-http = { version = "0.6", features = ["trace", "compression-full", "cors"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "chrono"] }
jsonwebtoken = "9"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
anyhow = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
zstd = "0.13"
bytes = "1"
hashlink = "0.10"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
